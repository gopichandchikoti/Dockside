name: Dockside quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_CHANNEL: chromium
      - run: npm run bootstrap
      - run: docker compose config --quiet
      - run: node scripts/check-deploy.mjs
      - run: npm run release
      - run: node scripts/smoke-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dockside-evidence
          path: |
            apps/web/dist
            apps/api/dist/server.mjs
            qa
            playwright-report
            release/*.tar.gz
            release/*.sha256
            release/latest.json
