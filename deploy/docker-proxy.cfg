global
  maxconn 64
defaults
  mode http
  timeout connect 5s
  timeout client 15s
  timeout server 15s
frontend docker
  bind :2375
  acl read_method method GET
  acl read_path path_reg ^/containers/json$ ^/containers/[a-f0-9]{12,64}/(json|stats|logs)$
  acl restart_method method POST
  acl restart_path path_reg ^/containers/[a-f0-9]{12,64}/restart$
  acl restart_enabled env(ALLOW_RESTART) -m str 1
  http-request allow if read_method read_path
  http-request allow if restart_method restart_path restart_enabled
  http-request deny deny_status 403
  default_backend engine
backend engine
  server docker /var/run/docker.sock
